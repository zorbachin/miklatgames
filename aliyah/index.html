<style>
  :root{
    --c-bg:#0d1120; --c-panel:#161d33; --c-panel2:#1f2947; --c-ink:#fdf3e3; --c-dim:#a9b3cf;
    --c-gold:#ffd166; --c-red:#ff5d73; --c-mint:#7ee8c7; --c-cyan:#3ee6ff;
    --font-display:"Courier New","Heebo",ui-monospace,Menlo,Consolas,monospace;
    --font-body:"Heebo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--c-bg);height:100%;overflow:hidden;overscroll-behavior:none;
    font-family:var(--font-body);color:var(--c-ink);-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center;background:#000;}
  #stage{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px 20px;z-index:5;overflow:hidden;
    background:linear-gradient(180deg,rgba(13,17,32,.78),rgba(13,17,32,.94));}
  .overlay.hidden{display:none;}
  .overlay.light{background:linear-gradient(180deg,rgba(13,17,32,.35),rgba(13,17,32,.85));}
  .ttl{font-family:var(--font-display);font-weight:900;font-size:clamp(26px,8vw,38px);letter-spacing:.06em;
    text-transform:uppercase;color:var(--c-gold);text-shadow:0 0 18px rgba(255,209,102,.55);line-height:1.08;}
  .ttl-he{margin-top:6px;font-size:16px;color:var(--c-cyan);}
  .tag{margin:12px auto 0;max-width:330px;font-size:14.5px;line-height:1.5;color:var(--c-dim);}
  .bigbtn{margin-top:18px;min-width:230px;min-height:56px;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(180deg,#ffd166,#e9a23b);color:#1a1405;font:900 18px var(--font-body);
    box-shadow:0 8px 24px rgba(233,162,59,.45);}
  .bigbtn:active{transform:scale(.97);}
  .bigbtn[disabled]{opacity:.45;box-shadow:none;}
  .ghostbtn{margin-top:10px;min-height:44px;min-width:230px;border-radius:12px;cursor:pointer;background:transparent;
    border:1px solid rgba(253,243,227,.35);color:var(--c-ink);font:700 14px var(--font-body);}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .row .ghostbtn,.row .bigbtn{min-width:0;flex:1 1 140px;}
  .arcade{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:12px;z-index:6;
    font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--c-gold);text-decoration:none;
    background:rgba(13,17,32,.7);border:1px solid rgba(255,209,102,.4);border-radius:999px;padding:6px 12px;}
  .langbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-end:12px;z-index:6;
    font-size:11px;font-weight:800;color:var(--c-cyan);background:rgba(13,17,32,.7);
    border:1px solid rgba(62,230,255,.4);border-radius:999px;padding:6px 12px;cursor:pointer;}
  /* hero pick */
  .heroes{display:flex;gap:12px;margin-top:16px;width:min(360px,92%);}
  .hero{flex:1;background:var(--c-panel);border:2px solid rgba(255,209,102,.25);border-radius:16px;padding:12px 8px;cursor:pointer;
    color:var(--c-ink);font:700 13px var(--font-body);line-height:1.35;}
  .hero.sel{border-color:var(--c-gold);box-shadow:0 0 0 3px rgba(255,209,102,.25),0 8px 20px rgba(0,0,0,.4);}
  .hero canvas{position:static;width:84px;height:84px;margin:0 auto 6px;display:block;}
  .hero small{display:block;font-weight:500;color:var(--c-dim);font-size:11.5px;margin-top:2px;}
  .name{margin-top:12px;width:min(300px,86%);background:var(--c-panel);border:1px solid rgba(253,243,227,.3);
    border-radius:12px;padding:11px 14px;color:var(--c-ink);font:700 16px var(--font-body);text-align:center;outline:none;}
  .name:focus{border-color:var(--c-gold);}
  /* HUD */
  #hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:4;pointer-events:none;
    display:flex;justify-content:space-between;padding:0 12px;gap:8px;font:800 13px var(--font-display);color:var(--c-ink);}
  #hud span{background:rgba(13,17,32,.62);border:1px solid rgba(253,243,227,.2);border-radius:999px;padding:5px 11px;white-space:nowrap;}
  #hud.hidden{display:none;}
  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);z-index:4;pointer-events:none;
    text-align:center;font:800 14px var(--font-body);color:var(--c-gold);text-shadow:0 2px 8px #000;opacity:0;transition:opacity .25s;}
  #hint.show{opacity:1;}
  /* mission sheet (map) */
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--c-panel);border-top:1px solid rgba(255,209,102,.35);
    border-radius:20px 20px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(110%);
    transition:transform .25s ease;box-shadow:0 -10px 30px rgba(0,0,0,.5);}
  #sheet.show{transform:translateY(0);}
  #sheet .stitle{font:900 18px var(--font-display);color:var(--c-gold);letter-spacing:.04em;text-transform:uppercase;}
  #sheet .show{margin-top:6px;font-size:13.5px;color:var(--c-dim);line-height:1.45;}
  #sheet .sstars{margin-top:6px;font-size:18px;letter-spacing:.1em;}
  #sheet .bigbtn{width:100%;margin-top:12px;}
  #mapTop{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:4;display:flex;gap:6px;
    justify-content:center;padding:0 10px;font:800 12px var(--font-display);}
  #mapTop span{background:rgba(13,17,32,.7);border:1px solid rgba(255,209,102,.3);border-radius:999px;padding:5px 10px;}
  #mapTop.hidden{display:none;}
  /* result */
  .stars{font-size:38px;letter-spacing:.08em;margin-top:6px;filter:drop-shadow(0 0 10px rgba(255,209,102,.5));}
  .score-card{margin-top:12px;background:var(--c-panel);border:1px solid rgba(255,209,102,.35);border-radius:16px;
    padding:12px 18px;font-size:14px;line-height:1.8;min-width:250px;max-width:340px;}
  .score-card .big{font-family:var(--font-display);font-size:22px;color:var(--c-gold);}
  .card{margin-top:12px;background:linear-gradient(180deg,#1f2947,#161d33);border:1px solid rgba(62,230,255,.45);
    border-radius:16px;padding:12px 16px;font-size:13.5px;line-height:1.5;max-width:340px;text-align:start;}
  .card b{color:var(--c-cyan);display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
  .words{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .w{background:rgba(126,232,199,.14);border:1px solid rgba(126,232,199,.5);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--c-mint);}
  .beatbanner{margin-top:12px;font-size:13px;font-weight:800;color:var(--c-red);background:rgba(255,93,115,.12);
    border:1px solid rgba(255,93,115,.45);border-radius:999px;padding:7px 16px;}
  .best-line{margin-top:8px;font-size:12.5px;color:var(--c-dim);}
  #toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 90px);transform:translateX(-50%) translateY(-10px);
    background:var(--c-panel);border:1px solid rgba(255,209,102,.55);border-radius:999px;color:var(--c-gold);padding:9px 18px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .2s ease;z-index:50;white-space:nowrap;max-width:94%;
    overflow:hidden;text-overflow:ellipsis;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .pausebtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-end:12px;z-index:6;font-size:12px;font-weight:800;
    color:var(--c-ink);background:rgba(13,17,32,.7);border:1px solid rgba(253,243,227,.3);border-radius:999px;padding:6px 12px;cursor:pointer;}
  .pausebtn.hidden{display:none;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <a class="arcade" id="arcadeBack" href="../">🚨 MIKLAT ARCADE</a>

  <div class="overlay" id="menu">
    <h1 class="ttl" data-i18n="title">ALIYAH: THE ADVENTURE</h1>
    <div class="ttl-he" data-i18n="titleAlt">עלייה: ההרפתקה</div>
    <p class="tag" data-i18n="tag">One suitcase. One country to unlock, city by city. Find your documents, survive the shaliach, out-rally Savta, reach the Kotel before sunset.</p>
    <div class="heroes">
      <button class="hero sel" id="heroGap" data-hero="gap"><canvas id="hcGap" width="168" height="168"></canvas><span data-i18n="heroGap">GAP-YEAR KID</span><small data-i18n="heroGapS">backpack, headband, texts Ima hourly</small></button>
      <button class="hero" id="heroFam" data-hero="fam"><canvas id="hcFam" width="168" height="168"></canvas><span data-i18n="heroFam">THE COHENS</span><small data-i18n="heroFamS">parent + Baby Ezra + a stroller</small></button>
    </div>
    <input class="name" id="nameIn" maxlength="14" autocomplete="off" placeholder="Your hero's name">
    <div class="beatbanner" id="beatBanner" style="display:none"></div>
    <button class="bigbtn" id="startBtn" data-i18n="start">BEGIN THE JOURNEY ▶</button>
    <button class="ghostbtn" id="contBtn" style="display:none" data-i18n="cont">CONTINUE ▶</button>
    <div class="best-line" id="menuBest"></div>
  </div>

  <div id="sheet">
    <div class="stitle" id="shTitle"></div>
    <div class="show" id="shHow"></div>
    <div class="sstars" id="shStars"></div>
    <button class="bigbtn" id="shPlay" data-i18n="play">PLAY ▶</button>
    <button class="ghostbtn" id="shClose" style="width:100%" data-i18n="close">CLOSE</button>
  </div>

  <div class="overlay hidden light" id="result">
    <h1 class="ttl" id="rsTitle"></h1>
    <div class="stars" id="rsStars"></div>
    <div class="score-card">
      <div id="rsLine1"></div>
      <div id="rsLine2"></div>
      <div id="rsBeat" style="display:none;color:var(--c-mint);font-weight:800"></div>
    </div>
    <div class="words" id="rsWords"></div>
    <div class="card" id="rsCard"><b data-i18n="cardHead">How it really works</b><span id="rsCardTxt"></span></div>
    <div class="row" style="width:min(340px,92%);margin-top:14px">
      <button class="bigbtn" id="rsNext" data-i18n="next">NEXT ▶</button>
      <button class="ghostbtn" id="rsRetry" data-i18n="retry">↻ RETRY</button>
    </div>
    <div class="row" style="width:min(340px,92%)">
      <button class="ghostbtn" id="rsShare" data-i18n="share">📤 Challenge the Group Chat</button>
      <button class="ghostbtn" id="rsMap" data-i18n="toMap">🗺️ MAP</button>
    </div>
    <a id="tipJar" hidden target="_blank" rel="noopener" style="margin-top:10px;font-size:13px;color:var(--c-gold);text-decoration:none;opacity:.85">☕ Keep the arcade free · תשאירו את המקלט חינם</a>
  </div>

  <div class="overlay hidden" id="paused">
    <h1 class="ttl" data-i18n="pausedT">PAUSED</h1>
    <button class="bigbtn" id="resumeBtn" data-i18n="resume">KEEP GOING ▶</button>
    <button class="ghostbtn" id="quitBtn" data-i18n="toMap">🗺️ MAP</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</div></div>

const SND={ctx:null,on:true,
  init(){if(!this.ctx)try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
    try{if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}catch(e){}},
  b(f0,f1,dur,type,vol,at){if(!this.on||!this.ctx)return;try{
    const c=this.ctx,t0=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+dur);}catch(e){}},
  tick(){this.b(420,520,.05,'square',.06);},pop(){this.b(660,990,.08,'sine',.12);},
  ding(){this.b(880,1320,.22,'triangle',.16);this.b(1100,1650,.3,'sine',.08);},
  thud(){this.b(160,60,.18,'sawtooth',.2);},over(){this.b(330,82,.6,'sawtooth',.16);},
  jump(){this.b(240,520,.12,'sine',.1);},swoosh(){this.b(300,140,.18,'sine',.08);},
  hit(){this.b(500,700,.06,'square',.1);},stamp(){this.b(120,80,.12,'square',.18);this.b(900,1200,.08,'sine',.08,.05);},
  clear(){[523,659,784,1046].forEach((f,i)=>this.b(f,f,.18,'triangle',.14,i*.11));},

/* ================= input: one vocabulary for every mission ================= */
const IN={down:false,x:0,y:0,sx:0,sy:0,st:0,keys:{}};
const stage=$('stage');
function evtXY(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function pDown(e){if(e.target&&e.target.closest&&e.target.closest('button,a,input'))return;SND.init();
  const p=evtXY(e);IN.down=true;IN.x=IN.sx=p.x;IN.y=IN.sy=p.y;IN.st=performance.now();
  if(SCREEN==='mission'&&CUR&&CUR.def.down)CUR.def.down(CUR,p.x,p.y);
  if(SCREEN==='map')mapTap(p.x,p.y);}
function pMove(e){if(!IN.down)return;const p=evtXY(e);IN.x=p.x;IN.y=p.y;
  if(SCREEN==='mission'&&CUR&&CUR.def.move)CUR.def.move(CUR,p.x,p.y);}
function pUp(e){if(!IN.down)return;IN.down=false;const p=evtXY(e);
  const dx=p.x-IN.sx,dy=p.y-IN.sy,dt=performance.now()-IN.st;
  if(SCREEN!=='mission'||!CUR)return;
  if(CUR.def.up)CUR.def.up(CUR,p.x,p.y);
  if(dt<600&&Math.hypot(dx,dy)>24){const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');if(CUR.def.swipe)CUR.def.swipe(CUR,dir);}
  else if(dt<450&&Math.hypot(dx,dy)<=24){if(CUR.def.tap)CUR.def.tap(CUR,p.x,p.y);}
}
stage.addEventListener('pointerdown',pDown);stage.addEventListener('pointermove',pMove);
stage.addEventListener('pointerup',pUp);stage.addEventListener('pointercancel',pUp);
window.addEventListener('keydown',e=>{const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(e.repeat)return;IN.keys[k]=true;
  if(SCREEN!=='mission'||!CUR)return;
  const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};
  if(map[k]&&CUR.def.swipe)CUR.def.swipe(CUR,map[k]);
  if((k===' '||k==='Enter')&&CUR.def.tap)CUR.def.tap(CUR,W/2,H/2);
  if(k==='Escape')pause();
});

function heldSide(){if(IN.down)return IN.x<W/2?-1:1;if(IN.keys.ArrowLeft||IN.keys.a)return -1;if(IN.keys.ArrowRight||IN.keys.d)return 1;return 0;}

const GR={};

function sky(key,stops,y0,y1){ctx.fillStyle=grad(key,y0||0,y1||H,stops);ctx.fillRect(0,0,W,H);}
function sun(x,y,r,col,glow){if(glow){ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,r*1.9,0,7);ctx.fill();}ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function txt(s,x,y,size,col,align,weight,stroke){ctx.font=(weight||900)+' '+size+'px '+(size>=20?'"Courier New",Heebo,monospace':'Heebo,system-ui,sans-serif');
  ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=Math.max(2,size*.14);ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}
function emo(s,x,y,size,flip){ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  if(flip){ctx.save();ctx.translate(x,y);ctx.scale(-1,1);ctx.fillText(s,0,0);ctx.restore();}else ctx.fillText(s,x,y);}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
/* skylines: silhouettes, anime-poster style */
function skyline(kind,base,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,base);
  if(kind==='telaviv'){const b=[[0,.72],[.06,.6],[.1,.6],[.13,.5],[.17,.5],[.2,.66],[.28,.66],[.3,.3],[.34,.3],[.36,.42],[.4,.42],[.42,.24],[.46,.24],[.48,.5],[.55,.5],[.58,.62],[.66,.62],[.68,.46],[.73,.46],[.76,.7],[.84,.7],[.86,.55],[.9,.55],[.93,.68],[1,.68]];
    b.forEach(p=>ctx.lineTo(p[0]*W,base-(1-p[1])*90));}
  else if(kind==='jerusalem'){const b=[[0,.6],[.08,.6],[.09,.45],[.12,.45],[.13,.6],[.3,.6],[.31,.5],[.34,.5],[.35,.6],[.45,.6],[.62,.6],[.63,.5],[.66,.5],[.67,.6],[.85,.6],[.86,.42],[.9,.42],[.91,.6],[1,.6]];
    b.forEach(p=>ctx.lineTo(p[0]*W,base-(1-p[1])*70));ctx.lineTo(W,base);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.arc(W*.53,base-40,34,Math.PI,0);ctx.lineTo(W*.53+34,base);ctx.lineTo(W*.53-34,base);ctx.closePath();ctx.fill();
    ctx.fillRect(W*.53-3,base-84,6,14);return;}
  else if(kind==='archive'){for(let i=0;i<=10;i++){const x=i/10*W;ctx.lineTo(x,base-40-(i%2?20:0));ctx.lineTo(x+W/10,base-40-(i%2?20:0));}}
  ctx.lineTo(W,base);ctx.closePath();ctx.fill();}
/* particles (pooled) */
const PARTS=[];
function part(x,y,vx,vy,life,col,size,t){if(PARTS.length>140)PARTS.shift();PARTS.push({x,y,vx,vy,life,max:life,col,size:size||4,t});}
function burst(x,y,col,n,spd){for(let i=0;i<(n||10);i++){const a=Math.random()*7,s=(spd||120)*(0.4+Math.random());part(x,y,Math.cos(a)*s,Math.sin(a)*s-60,.6+Math.random()*.4,col,3+Math.random()*4);}}
function updateParts(dt){for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.life-=dt;if(p.life<=0){PARTS.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;}}
function drawParts(){for(const p of PARTS){const a=Math.max(0,p.life/p.max);ctx.globalAlpha=a;if(p.t){emo(p.t,p.x,p.y,p.size);}else{ctx.fillStyle=p.col;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}}ctx.globalAlpha=1;}
let SHAKE=0;function shake(v){SHAKE=Math.min(.4,SHAKE+v);}

/* ================= the hero: drawn vector, headband, backpack / stroller ================= */
const HERO_PAL={gap:{skin:'#f2c39b',hair:'#3b2417',shirt:'#ff7a45',pants:'#2b5fd9',shoe:'#fdf3e3',band:'#ffd166'},
                fam:{skin:'#e8b58f',hair:'#1f1a1a',shirt:'#7ee8c7',pants:'#2f3b5c',shoe:'#1a1405',band:'#ffd166'}};
/* x,y = feet centre. s = scale (1 → ~64px tall). pose: run|stand|jump|slide|surf|sit. t = time for animation */
function drawHero(x,y,s,pose,t,flip,heroKind){
  const k=heroKind||SAVE.hero,P=HERO_PAL[k]||HERO_PAL.gap;t=t||0;
  ctx.save();ctx.translate(x,y);ctx.scale(flip?-s:s,s);
  const run=pose==='run',ph=Math.sin(t*14),bob=run?Math.abs(ph)*2:0;
  if(pose==='slide'){ctx.translate(0,10);ctx.rotate(-.9);}
  ctx.translate(0,-bob);
  /* stroller for the family hero (behind, offset) */
  if(k==='fam'&&pose!=='surf'&&pose!=='slide'){ctx.save();ctx.translate(-26,0);
    ctx.fillStyle='#ff5d73';rr(-14,-30,26,16,6,'#ff5d73');ctx.fillStyle='#1f2947';ctx.fillRect(-12,-16,22,4);
    ctx.beginPath();ctx.arc(-10,-4,5,0,7);ctx.arc(8,-4,5,0,7);ctx.fillStyle='#0d1120';ctx.fill();
    ctx.strokeStyle='#a9b3cf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10,-18);ctx.lineTo(22,-34);ctx.stroke();
    ctx.fillStyle=P.skin;ctx.beginPath();ctx.arc(0,-33,6,0,7);ctx.fill();ctx.fillStyle='#ffd166';ctx.fillRect(-6,-42,12,5);ctx.restore();}
  /* backpack */
  if(k==='gap'&&pose!=='surf')rr(-16,-44,12,20,4,'#2b8a5e');
  /* legs */
  ctx.strokeStyle=P.pants;ctx.lineWidth=7;ctx.lineCap='round';
  const l1=run?ph*9:0,l2=run?-ph*9:0;
  if(pose==='jump'){ctx.beginPath();ctx.moveTo(-4,-24);ctx.lineTo(-10,-10);ctx.moveTo(4,-24);ctx.lineTo(10,-12);ctx.stroke();}
  else if(pose==='surf'){ctx.beginPath();ctx.moveTo(-6,-24);ctx.lineTo(-12,-4);ctx.moveTo(6,-24);ctx.lineTo(12,-4);ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(-4,-24);ctx.lineTo(-4+l1,-2);ctx.moveTo(4,-24);ctx.lineTo(4+l2,-2);ctx.stroke();}
  /* shoes */
  ctx.fillStyle=P.shoe;if(pose==='jump'){rr(-15,-12,10,5,2,P.shoe);rr(6,-14,10,5,2,P.shoe);}else if(pose==='surf'){rr(-17,-6,10,5,2,P.shoe);rr(7,-6,10,5,2,P.shoe);}else{rr(-9+l1,-4,10,5,2,P.shoe);rr(-1+l2,-4,10,5,2,P.shoe);}
  /* body */
  rr(-10,-46,20,24,6,P.shirt);
  /* arms */
  ctx.strokeStyle=P.skin;ctx.lineWidth=5;ctx.beginPath();
  if(pose==='jump'){ctx.moveTo(-9,-42);ctx.lineTo(-18,-58);ctx.moveTo(9,-42);ctx.lineTo(18,-58);}
  else if(pose==='surf'){ctx.moveTo(-9,-42);ctx.lineTo(-22,-36);ctx.moveTo(9,-42);ctx.lineTo(22,-36);}
  else{ctx.moveTo(-9,-42);ctx.lineTo(-13-l2*.6,-28);ctx.moveTo(9,-42);ctx.lineTo(13-l1*.6,-28);}
  ctx.stroke();
  /* head */
  ctx.fillStyle=P.skin;ctx.beginPath();ctx.arc(0,-58,13,0,7);ctx.fill();
  ctx.fillStyle=P.hair;ctx.beginPath();ctx.arc(0,-62,13,Math.PI,0);ctx.fill();
  if(k==='gap'){for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*5,-70,4,0,7);ctx.fill();}}
  else{rr(-14,-70,28,7,3,'#1f2947');rr(-2,-72,18,5,2,'#1f2947');}
  /* headband (the Naruto nod) */
  rr(-14,-63,28,6,2,P.band);ctx.fillStyle='#0d1120';ctx.font='6px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✡',0,-60);
  /* face */
  ctx.fillStyle='#0d1120';ctx.beginPath();ctx.arc(-4,-56,1.6,0,7);ctx.arc(5,-56,1.6,0,7);ctx.fill();
  ctx.strokeStyle='#0d1120';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(1,-52,3.5,0.2,Math.PI-0.2);ctx.stroke();
  ctx.restore();
}
/* draw a little hero icon into the menu picker canvases (temporarily retarget ctx) */
function paintHeroCard(id,kind){try{const c=$(id);if(!c||!c.getContext)return;const g=c.getContext('2d');if(!g)return;
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,168,168);const o=ctx;ctx=g;

/* ================= missions ================= */
const MISSIONS={};const ORDER=['docs','apostille','interview','carousel','surf','volley','matkot','shuk','kotel','tefillin'];
const CHAPTERS=[{id:'prologue',icon:'🧳',m:['docs','apostille','interview'],need:0},{id:'arrival',icon:'✈️',m:['carousel'],need:3},
  {id:'telaviv',icon:'🏖️',m:['surf','volley','matkot'],need:6},{id:'jerusalem',icon:'🕍',m:['shuk','kotel','tefillin'],need:15}];
const chapterOf=id=>CHAPTERS.find(c=>c.m.includes(id));
function rnd(a,b){return a+Math.random()*(b-a);}
function rint(a,b){return Math.floor(rnd(a,b+1));}

/* ---------- shared pseudo-3D 3-lane runner (docs, kotel) ---------- */
const RUN={
  hy:()=>H*.40,gy:()=>H*.86,
  proj(z){const sc=.1+.9*z*z;return{sc,y:RUN.hy()+(RUN.gy()-RUN.hy())*Math.pow(z,1.7)};},
  laneX(lane,sc){return W/2+lane*W*.3*sc;},
  init(M,cfg){Object.assign(M,{lane:0,px:0,jumpT:0,speed:cfg.speed0,speedMax:cfg.speedMax,dist:0,len:cfg.len,ents:[],spawnT:.2,safe:0,rows:0,
    hearts:3,hits:0,inv:0,got:0,coins:0,words:[],cfg,finished:false,nextDocRow:cfg.docEvery?4:1e9});},
  spawnRow(M){const c=M.cfg;M.rows++;
    const step=Math.random()<.5?-1:1;M.safe=Math.max(-1,Math.min(1,M.safe+(Math.random()<.55?step:0)));
    const dens=Math.min(.85,c.dens0+M.dist/M.len*.4);
    for(let l=-1;l<=1;l++){
      if(l===M.safe){
        if(c.docs&&M.rows>=M.nextDocRow&&M.docQ.length){const d=M.docQ.shift();M.ents.push({lane:l,z:0,type:'doc',e:d});M.nextDocRow=M.rows+c.docEvery;}
        else if(M.rows%9===0&&M.wordQ.length){M.ents.push({lane:l,z:0,type:'word',e:M.wordQ.shift()});}
        else if(Math.random()<.45)M.ents.push({lane:l,z:0,type:'coin'});
        continue;}
      const r=Math.random();
      if(r<dens){/* fairness: a lane two away from the safe lane only ever gets a jumpable obstacle */
        const low=Math.abs(l-M.safe)===2||Math.random()<.65;M.ents.push({lane:l,z:0,type:low?'low':'block',e:low?c.low[rint(0,c.low.length-1)]:c.block[rint(0,c.block.length-1)]});}
      else if(r<dens+.15)M.ents.push({lane:l,z:0,type:'coin'});
    }},
  update(M,dt){
    if(M.finished)return;
    M.speed=Math.min(M.speedMax,M.speed+dt*.02);
    const dz=M.speed*dt;M.dist+=dz;M.inv=Math.max(0,M.inv-dt);
    if(M.jumpT>0)M.jumpT=Math.max(0,M.jumpT-dt);
    M.px+=(M.lane-M.px)*Math.min(1,dt*14);
    M.spawnT-=dz;if(M.spawnT<=0){M.spawnRowFn(M);M.spawnT=M.cfg.gap;}
    for(let i=M.ents.length-1;i>=0;i--){const e=M.ents[i];e.z+=dz;
      if(e.z>1.08){if(e.type==='doc'&&!e.hit){M.docQ.push(e.e);M.nextDocRow=M.rows+5;}M.ents.splice(i,1);continue;}
      if(e.hit||e.z<.9||e.z>1.02||e.lane!==M.lane)continue;
      if(e.type==='coin'){e.hit=true;M.coins+=5;SND.pop();part(RUN.laneX(e.lane,1),RUN.gy()-30,0,-80,.5,'#ffd166',12,'₪');M.ents.splice(i,1);continue;}
      if(e.type==='doc'){e.hit=true;M.got++;SND.ding();toast(M.got===M.cfg.docs.length?T().toasts.allDocs:T().toasts.doc);burst(RUN.laneX(e.lane,1),RUN.gy()-40,'#7ee8c7',12);M.ents.splice(i,1);continue;}
      if(e.type==='word'){e.hit=true;M.words.push(e.e);SND.ding();toast('🔤 '+e.e[0]+' · '+e.e[2]);M.ents.splice(i,1);continue;}
      const jumping=M.jumpT>0;
      if(e.type==='low'&&jumping)continue;
      if(M.inv>0)continue;
      e.hit=true;M.hearts--;M.hits++;M.inv=1.1;SND.thud();shake(.35);burst(RUN.laneX(e.lane,1),RUN.gy()-30,'#ff5d73',10);
      if(M.hearts<=0){M.fail();return;}
    }
    if(M.dist>=M.len){M.finished=true;M.win();}
  },
  jump(M){if(M.jumpT<=0){M.jumpT=.7;SND.jump();}},
  swipe(M,dir){if(dir==='left')M.lane=Math.max(-1,M.lane-1);else if(dir==='right')M.lane=Math.min(1,M.lane+1);else if(dir==='up')RUN.jump(M);SND.tick();},
  draw(M,scene){
    const hy=RUN.hy(),gy=RUN.gy();
    scene(M);
    /* road */
    ctx.fillStyle=M.cfg.road;ctx.beginPath();ctx.moveTo(W/2-W*.06,hy);ctx.lineTo(W/2+W*.06,hy);ctx.lineTo(W/2+W*.62,H);ctx.lineTo(W/2-W*.62,H);ctx.closePath();ctx.fill();
    ctx.strokeStyle=M.cfg.roadLine;ctx.lineWidth=2;
    for(const l of[-.5,.5]){ctx.beginPath();ctx.moveTo(RUN.laneX(l,.1),hy);ctx.lineTo(RUN.laneX(l,1.25),H);ctx.stroke();}
    /* scrolling ground stripes for speed feel */
    for(let i=0;i<8;i++){const z=((i/8)+(M.dist%1))%1;const p=RUN.proj(z);ctx.globalAlpha=.12*z;ctx.fillStyle='#fff';ctx.fillRect(W/2-W*.6*p.sc,p.y,W*1.2*p.sc,2);}
    ctx.globalAlpha=1;
    /* side walls: repeating props scrolling by */
    for(let i=0;i<10;i++){const z=((i/10)+(M.dist*.5%1))%1;const p=RUN.proj(z);const s=p.sc;if(s<.15)continue;
      const sz=44*s;emo(M.cfg.wallL,W/2-W*.55*s-sz*.3,p.y-sz*.45,sz);emo(M.cfg.wallR,W/2+W*.55*s+sz*.3,p.y-sz*.45,sz);}
    /* entities far→near */
    const es=M.ents.slice().sort((a,b)=>a.z-b.z);
    for(const e of es){const p=RUN.proj(e.z),x=RUN.laneX(e.lane,p.sc),s=p.sc;
      if(e.type==='coin'){txt('₪',x,p.y-14*s,26*s,'#ffd166','center',900,'#4a3400');}
      else if(e.type==='doc'){emo(e.e.icon,x,p.y-22*s,40*s);ctx.globalAlpha=.6;ctx.strokeStyle='#7ee8c7';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,p.y-22*s,28*s,0,7);ctx.stroke();ctx.globalAlpha=1;}
      else if(e.type==='word'){rr(x-30*s,p.y-36*s,60*s,26*s,8*s,'rgba(126,232,199,.25)','#7ee8c7');txt(e.e[0],x,p.y-23*s,16*s,'#fdf3e3');}
      else{ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,p.y,30*s,8*s,0,0,7);ctx.fill();ctx.globalAlpha=1;
        emo(e.e,x,p.y-(e.type==='block'?34:18)*s,(e.type==='block'?64:40)*s);}
    }
    /* hero */
    const jy=M.jumpT>0?Math.sin(M.jumpT/.7*Math.PI)*70:0;
    const hx=RUN.laneX(M.px,1);
    ctx.globalAlpha=.3;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(hx,gy+2,26,7,0,0,7);ctx.fill();ctx.globalAlpha=1;
    if(M.inv>0&&Math.floor(M.inv*12)%2===0)ctx.globalAlpha=.4;
    drawHero(hx,gy-jy,1.05,M.jumpT>0?'jump':'run',M.t);ctx.globalAlpha=1;
    /* progress bar */
    const pw=W*.56,px0=W/2-pw/2,py=H-26;
    rr(px0,py,pw,8,4,'rgba(0,0,0,.45)');rr(px0,py,pw*Math.min(1,M.dist/M.len),8,4,'#ffd166');emo(M.cfg.goal,px0+pw+16,py+4,20);
  }
};
function hearts(n){return '❤️'.repeat(Math.max(0,n))+'🖤'.repeat(Math.max(0,3-n));}

MISSIONS.docs={id:'docs',
  init(M){const fam=SAVE.hero==='fam';
    const docs=[{icon:'📜',k:'birth'},{icon:'🛂',k:'passport'},{icon:'✉️',k:'rabbi'},fam?{icon:'💍',k:'marriage'}:{icon:'📷',k:'photos'},{icon:'🧾',k:'police'}];
    RUN.init(M,{speed0:.75,speedMax:1.15,len:34,gap:.34,dens0:.35,docs,docEvery:14,low:['📦','🐈','🪑'],block:['🗄️','📚'],
      road:'#3b2a1e',roadLine:'rgba(255,209,102,.25)',wallL:'📚',wallR:'🗄️',goal:'📁'});
    M.docQ=docs.slice();M.wordQ=WORDS.docs.slice();M.spawnRowFn=RUN.spawnRow;
    M.win=()=>M.finish(true);M.fail=()=>M.finish(false);},
  update(M,dt){RUN.update(M,dt);},
  hud(M){return[hearts(M.hearts),T().m.docs.hud(M.cfg.docs.map((d,i)=>i<M.got?d.icon:'▫️').join(''))];},
  draw(M){RUN.draw(M,M=>{sky('arch',[[0,'#1a1226'],[.4,'#3b2a1e'],[1,'#6b4a2e']]);
      ctx.fillStyle='rgba(255,209,102,.08)';for(let i=0;i<6;i++){const y=H*.05+i*H*.06;ctx.fillRect(0,y,W,2);}
      skyline('archive',RUN.hy()+2,'#241a12');

      for(let i=0;i<14;i++){const x=(i*97+M.t*12)%W,y=(i*53+M.t*7)%(H*.4);ctx.globalAlpha=.25;ctx.fillStyle='#ffd166';ctx.fillRect(x,y,2,2);}ctx.globalAlpha=1;
      /* collapsing shelves behind: a wall creeping up */

};

/* ---- 1 · THE APOSTILLE (tap-timing) ---- */
MISSIONS.apostille={id:'apostille',
  init(M){Object.assign(M,{n:0,ok:0,perfect:0,miss:0,mt:0,speed:2.2,zone:.30,slam:0,flash:'',flashT:0,words:[],coins:0,last:null,icons:['📜','🛂','✉️','💍','🧾']});},
  markerX(M){return Math.sin(M.mt*M.speed);},   // -1..1
  update(M,dt){M.mt+=dt;M.slam=Math.max(0,M.slam-dt*4);M.flashT=Math.max(0,M.flashT-dt);},
  tap(M){if(M.n>=5||M.slam>0)return;const off=Math.abs(MISSIONS.apostille.markerX(M));M.slam=1;M.n++;
    let grade;if(off<M.zone*.4){grade='perfect';M.perfect++;M.ok++;M.coins+=20;SND.ding();if(M.words.length<3)M.words.push(WORDS.apostille[M.words.length]);}
    else if(off<M.zone){grade='good';M.ok++;M.coins+=10;SND.stamp();}else{grade='bad';M.miss++;SND.thud();shake(.25);}
    M.last=grade;M.flash=T().toasts[grade];M.flashT=.9;burst(W/2,H*.5,grade==='bad'?'#ff5d73':'#7ee8c7',grade==='perfect'?16:8);
    M.speed+=.55;M.zone=Math.max(.11,M.zone-.045);
    if(M.n>=5)setTimeout(()=>M.finish(M.ok>=3),700);},
  hud(M){return['🔏 '+'✅'.repeat(M.ok)+'❌'.repeat(M.miss),T().m.apostille.hud(M.n)];},
  draw(M){sky('apo',[[0,'#1b2440'],[1,'#0d1120']]);
    /* desk */

/* ---- 6 · MATKOT VS SAVTA (drag paddle) ---- */
MISSIONS.matkot={id:'matkot',
  init(M){Object.assign(M,{px:W/2,tx:W/2,pw:80,bx:W/2,by:H*.3,vx:0,vy:0,rally:0,miss:0,serveT:1,slipper:false,slipperHit:false,umb:null,words:[],coins:0,sav:W/2,flash:'',flashT:0,curve:0});},
  serve(M){M.bx=M.sav;M.by=H*.24;const sp=300+M.rally*11;M.vy=sp;M.vx=(Math.random()-.5)*sp*.8;M.curve=(Math.random()-.5)*(60+M.rally*8);
    M.slipper=M.rally>=20&&M.rally%5===0;if(M.slipper){M.vy*=1.25;toast(T().toasts.slipper);}},
  update(M,dt){M.flashT=Math.max(0,M.flashT-dt);M.px+=(M.tx-M.px)*Math.min(1,dt*18);
    if(M.serveT>0){M.serveT-=dt;M.sav+=(M.bx-M.sav)*dt*4;if(M.serveT<=0)MISSIONS.matkot.serve(M);return;}
    if(M.rally>=10&&!M.umb&&Math.random()<dt*.15)M.umb={x:-40,y:H*.5,vx:120};
    if(M.umb){M.umb.x+=M.umb.vx*dt;if(M.umb.x>W+40)M.umb=null;}
    const steps=3,sdt=dt/steps;

      if(M.bx<14){M.bx=14;M.vx=Math.abs(M.vx);}if(M.bx>W-14){M.bx=W-14;M.vx=-Math.abs(M.vx);}
      if(M.umb&&Math.abs(M.bx-M.umb.x)<34&&Math.abs(M.by-M.umb.y)<22&&M.vy>0){M.vy=-Math.abs(M.vy)*.9;M.vx+=rnd(-150,150);toast(T().toasts.umbrella);SND.hit();}
      /* Savta returns everything at the top */
      if(M.vy<0&&M.by<=H*.26){M.by=H*.26;const sp=Math.hypot(M.vx,M.vy)*1.05;const ang=rnd(-.6,.6);M.vx=Math.sin(ang)*sp;M.vy=Math.cos(ang)*sp;M.curve=(Math.random()-.5)*(60+M.rally*8);
        M.slipper=M.rally>=20&&M.rally%5===4;if(M.slipper){M.vy*=1.2;toast(T().toasts.slipper);}SND.hit();}
      /* player paddle */

        if(M.slipper){M.slipperHit=true;M.flash=T().toasts.slipper;M.flashT=.8;M.coins+=30;}

/* ---- 9 · TEFILLIN WITH CHABAD (tap on the beat, optional) ---- */
MISSIONS.tefillin={id:'tefillin',

  period(M){return 60/M.bpm;},

      M.lead=Math.max(0,M.lead-1);M.tapped=false;M.lastBeatAt=M.t;M.nextBeat+=MISSIONS.tefillin.period(M);SND.metro();M.beat++;}},
  tap(M){if(M.tapped)return;const per=MISSIONS.tefillin.period(M);const since=M.t-M.lastBeatAt;const d=Math.min(since,per-since);

      if(M.count===7||M.count===10){if(M.words.length<3)M.words.push(WORDS.tefillin[M.words.length]);}

    emo('🧔‍♂️',W*.22,H*.72,64);rr(W*.22-36,H*.8,72,20,6,'#0d1120');txt('CHABAD',W*.22,H*.81,11,'#ffd166');

/* ================= harness: run a mission, collect the result ================= */
let SCREEN='menu',CUR=null,paused=false,lastResult=null;
function show(id){for(const o of['menu','result','paused'])$(o).classList.toggle('hidden',o!==id);}
function hideOverlays(){for(const o of['menu','result','paused'])$(o).classList.add('hidden');}
function chapterUnlocked(ch){return totalStars()>=ch.need;}
function missionUnlocked(id){return chapterUnlocked(chapterOf(id));}
function startMission(id){
  const def=MISSIONS[id];if(!def)return;
  PARTS.length=0;SHAKE=0;
  CUR={def,id,t:0,ended:false,finish(ok){finishMission(this,ok);}};
  def.init(CUR);
  SCREEN='mission';paused=false;hideOverlays();$('sheet').classList.remove('show');$('mapTop').classList.add('hidden');
  $('hud').classList.remove('hidden');$('pauseBtn').classList.remove('hidden');$('langBtn').style.display='none';
  hint(T().hints[id]);track('mission-'+id);
}
function finishMission(M,ok){
  if(M.ended)return;M.ended=true;
  const r=M.def.result(M,ok);lastResult={id:M.id,ok,...r};
  const prev=SAVE.stars[M.id]||0;
  if(ok){SAVE.stars[M.id]=Math.max(prev,r.stars);SAVE.best[M.id]=Math.max(SAVE.best[M.id]||0,r.score);SAVE.coins+=r.coins||0;
    for(const w of r.words||[]){if(!SAVE.words.some(x=>x[0]===w[0]))SAVE.words.push(w);}
    const npc={matkot:'savta',shuk:'shuki',interview:'dvir',tefillin:'mendy',carousel:'tamar'}[M.id];if(npc&&!SAVE.friends.includes(npc))SAVE.friends.push(npc);
    SND.clear();track('clear-'+M.id);}
  else{SND.over();track('fail-'+M.id);}
  save();
  setTimeout(()=>showResult(lastResult),ok?350:200);
}
function nextMissionId(id){const i=ORDER.indexOf(id);for(let j=i+1;j<ORDER.length;j++){if(missionUnlocked(ORDER[j]))return ORDER[j];}return null;}
function showResult(r){
  SCREEN='result';$('hud').classList.add('hidden');$('pauseBtn').classList.add('hidden');
  const m=T().m[r.id];
  $('rsTitle').textContent=r.ok?T().cleared:T().failed;$('rsTitle').style.color=r.ok?'var(--c-gold)':'var(--c-red)';
  $('rsStars').textContent=r.ok?'★'.repeat(r.stars)+'☆'.repeat(3-r.stars):'☆☆☆';
  $('rsLine1').innerHTML=`<span>${m.name}</span> · <span class="big">${r.line1}</span>`;
  $('rsLine2').textContent=(r.line2?r.line2+' · ':'')+T().score+' '+Math.max(0,r.score)+' · ₪'+(r.coins||0);
  const rw=$('rsWords');rw.innerHTML='';(r.words||[]).forEach(w=>{const s=document.createElement('span');s.className='w';s.textContent=`${w[0]} · ${w[1]} · ${w[2]}`;rw.appendChild(s);});
  $('rsCardTxt').textContent=r.ok?m.card:(T().tipRetry+' '+m.fail);
  const nx=r.ok?nextMissionId(r.id):null;$('rsNext').style.display=nx?'':'none';$('rsNext').dataset.next=nx||'';
  $('rsRetry').className=r.ok?'ghostbtn':'bigbtn';
  const beatEl=$('rsBeat');if(beatTarget>0&&totalStars()>beatTarget){beatEl.style.display='';beatEl.textContent=T().beatWin;}else beatEl.style.display='none';
  const ch=chapterOf(r.id);const nextCh=CHAPTERS[CHAPTERS.indexOf(ch)+1];
  if(nextCh&&r.ok&&chapterUnlocked(nextCh)&&!SAVE['seen_'+nextCh.id]){SAVE['seen_'+nextCh.id]=true;save();toast('🔓 '+T().chapters[nextCh.id]);track('chapter-'+nextCh.id);}
  show('result');
}
function pause(){if(SCREEN!=='mission'||paused)return;paused=true;show('paused');}
function resume(){if(!paused)return;paused=false;hideOverlays();}
function toMap(){SCREEN='map';CUR=null;paused=false;hideOverlays();$('hud').classList.add('hidden');$('pauseBtn').classList.add('hidden');$('mapTop').classList.remove('hidden');$('langBtn').style.display='';paintMapTop();}
function paintMapTop(){$('mtStars').textContent=(SAVE.name?SAVE.name+' · ':'')+'★ '+totalStars();$('mtCoins').textContent='₪ '+SAVE.coins;$('mtWords').textContent='🔤 '+SAVE.words.length;}

function mapBox(){const top=H*.13,bot=H*.9;const h=bot-top;const w=Math.min(W*.55,h/2.75);return{x0:W*.5-w*.35,y0:top,w,h};}
function geo(lon,lat){const b=mapBox();return{x:b.x0+(lon-34.2)/1.7*b.w,y:b.y0+(33.4-lat)/4*b.h};}
/* stylised positions: real-ish geography, nudged so labels and bubble rows never collide on a 320px phone */
const PINS={prologue:{lon:34.35,lat:33.0,side:1,bub:'right'},arrival:{lon:34.9,lat:31.85,side:1,bub:'right'},telaviv:{lon:34.72,lat:32.35,side:-1,bub:'left'},jerusalem:{lon:35.21,lat:31.35,side:1,bub:'below'}};

function bubbles(){const out=[];for(const ch of CHAPTERS){const p=PINS[ch.id];const a=geo(p.lon,p.lat);
    const n=ch.m.length,gap=50;let x0,y=a.y;
    if(p.bub==='below'){x0=a.x-(n-1)*gap/2;y=a.y+48;}else x0=p.bub==='right'?a.x+44:a.x-44-(n-1)*gap;
    x0=Math.max(30,Math.min(W-30-(n-1)*gap,x0));

  $('sheet').classList.remove('show');}
function openSheet(id){sheetFor=id;const m=T().m[id];$('shTitle').textContent=m.name;$('shHow').textContent=m.how;
  const st=SAVE.stars[id]||0;$('shStars').textContent=st?T().bestStars(st,SAVE.best[id]||0):'☆☆☆';$('sheet').classList.add('show');SND.tick();}

/* ================= menu ================= */
function paintMenu(){
  const started=SAVE.started;$('contBtn').style.display=started?'':'none';
  $('startBtn').textContent=started?(lang==='he'?'מסע חדש':'NEW JOURNEY'):T().start;
  $('menuBest').textContent=started?T().best(totalStars()):'';
  const bb=$('beatBanner');if(beatTarget>0){bb.style.display='';bb.textContent=T().beatBanner(beatTarget);}else bb.style.display='none';
  $('heroGap').classList.toggle('sel',SAVE.hero!=='fam');$('heroFam').classList.toggle('sel',SAVE.hero==='fam');
  paintHeroCard('hcGap','gap');paintHeroCard('hcFam','fam');
  const ni=$('nameIn');if(!ni.value)ni.value=SAVE.name||'';
}
let resetArmed=0;
function newJourney(){
  if(SAVE.started&&Date.now()-resetArmed>2500){resetArmed=Date.now();toast(lang==='he'?'הקישו שוב למחיקת ההתקדמות':'Tap again to erase progress');return;}
  SAVE.stars={};SAVE.best={};SAVE.coins=0;SAVE.words=[];SAVE.friends=[];for(const k of Object.keys(SAVE))if(k.startsWith('seen_'))delete SAVE[k];
  SAVE.started=true;SAVE.name=($('nameIn').value||'').trim().slice(0,14)||T().defName[SAVE.hero];save();track('start');
  startMission('docs');
}
$('heroGap').addEventListener('click',()=>{SAVE.hero='gap';save();paintMenu();SND.tick();});
$('heroFam').addEventListener('click',()=>{SAVE.hero='fam';save();paintMenu();SND.tick();});
$('startBtn').addEventListener('click',()=>{SND.init();newJourney();});
$('contBtn').addEventListener('click',()=>{SND.init();SAVE.name=($('nameIn').value||'').trim().slice(0,14)||SAVE.name||T().defName[SAVE.hero];save();toMap();});
$('nameIn').addEventListener('keydown',e=>e.stopPropagation());
$('shPlay').addEventListener('click',()=>{if(sheetFor)startMission(sheetFor);});
$('shClose').addEventListener('click',()=>$('sheet').classList.remove('show'));
$('pauseBtn').addEventListener('click',pause);$('resumeBtn').addEventListener('click',resume);$('quitBtn').addEventListener('click',toMap);
$('rsNext').addEventListener('click',()=>{const n=$('rsNext').dataset.next;if(n)startMission(n);else toMap();});
$('rsRetry').addEventListener('click',()=>{if(lastResult)startMission(lastResult.id);});
$('rsMap').addEventListener('click',toMap);
$('langBtn').addEventListener('click',()=>{lang=lang==='he'?'en':'he';try{localStorage.setItem('miklat.lang',lang);}catch(e){}applyLang();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
try{const ab=$('arcadeBack');ab.addEventListener('pointerdown',e=>e.stopPropagation());}catch(e){}

/* share: spoiler-free chapter grid + ?beat= */
function shareGrid(){return CHAPTERS.filter(ch=>chapterUnlocked(ch)).map(ch=>{const s=ch.m.reduce((a,id)=>a+(SAVE.stars[id]||0),0);const avg=Math.round(s/ch.m.length);return ch.icon+'★'.repeat(avg)+'☆'.repeat(3-avg);}).join(' ');}
$('rsShare').addEventListener('click',async()=>{const txtS=T().shareTxt(SAVE.name||'?',shareGrid(),totalStars());
  try{if(navigator.share){await navigator.share({text:txtS});track('share');return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(txtS);toast(T().copied);track('share');}catch(e){toast(txtS.slice(0,60)+'…');}});

/* ================= loop ================= */
let lastTs=0,menuT=0;
function drawMenuBg(t){sky('menu',[[0,'#1b2a5e'],[.5,'#ff9a5c'],[.72,'#ffd166']],0,H*.6);sun(W*.7,H*.28,54,'#fff2c2','rgba(255,242,194,.3)');skyline('telaviv',H*.55,'#2b3a66');
  ctx.fillStyle=grad('msea',H*.55,H,[[0,'#1c8fd6'],[1,'#0b2f5a']]);ctx.fillRect(0,H*.55,W,H*.45);
  emo('✈️',W*.15+Math.sin(t*.5)*10,H*.14+Math.cos(t*.7)*6,30);}
function updateHud(){if(!CUR||!CUR.def.hud)return;const h=CUR.def.hud(CUR);$('hudL').textContent=h[0];$('hudR').textContent=h[1];}
function frame(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
  try{
    ctx.save();if(SHAKE>0){ctx.translate((Math.random()-.5)*SHAKE*18,(Math.random()-.5)*SHAKE*18);SHAKE=Math.max(0,SHAKE-dt*1.6);}
    if(SCREEN==='menu'){menuT+=dt;drawMenuBg(menuT);}
    else if(SCREEN==='map'){menuT+=dt;drawMap(menuT);}
    else if(CUR){if(SCREEN==='mission'&&!paused&&!CUR.ended){CUR.t+=dt;CUR.def.update(CUR,dt);updateParts(dt);updateHud();}
      CUR.def.draw(CUR);drawParts();}
    ctx.restore();
  }catch(e){ctx.restore&&ctx.restore();}
  requestAnimationFrame(frame);
}
applyLang();paintMenu();requestAnimationFrame(frame);
if(SAVE.started)$('contBtn').style.display='';

/* ================= SW ================= */
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
